services:
  db:
    image: postgres:16-alpine
    container_name: gamerzone-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - gamerzone_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: gamerzone-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    # Persist to disk so revoked tokens stay revoked across a restart. Without this,
    # a container restart would silently make every blacklisted token valid again.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - gamerzone_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Development-only fake SMTP server. It accepts mail exactly like a real provider
  # but delivers nothing to the outside world - everything lands in its web inbox at
  # http://localhost:8025 instead. This makes it impossible to accidentally email a
  # real person while testing. In production these settings point at a real provider.
  mailpit:
    image: axllent/mailpit:latest
    container_name: gamerzone-mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"  # SMTP, where the app sends
      - "${MAILPIT_UI_PORT:-8025}:8025"    # web inbox, where you read

volumes:
  gamerzone_pgdata:
  gamerzone_redisdata:
